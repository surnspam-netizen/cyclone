name: Build Cyclone

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show files
        shell: bash
        run: ls -R | head -50
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --onefile --name Cyclone --add-data "ui;ui" --collect-all minecraft_launcher_lib launcher.py
      - name: Add mods folder
        shell: bash
        run: |
          mkdir -p dist/mods
          cp mods/README.txt dist/mods/
      - uses: actions/upload-artifact@v4
        with:
          name: Cyclone-Windows
          path: dist/
          
